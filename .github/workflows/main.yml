name: GTA9 ReSukiSU V2 - Stage 1 Source Audit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  GTA9_REPO: https://github.com/prabhatkrmishra/kernel_samsung_gta9.git
  GTA9_BRANCH: 15.0

jobs:
  source-audit:
    runs-on: ubuntu-latest


    steps:

      # ============================================================
      # 0. STOCK AP BINARY FORENSICS
      # Uses the AP files already stored in this repository.
      # This is deliberately done BEFORE trusting any external
      # GTA9 kernel source tree.
      # ============================================================
      - name: Audit stock AP kernel artifacts
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "STOCK AP BINARY FORENSICS"
          echo "=================================================="

          sudo apt-get update
          sudo apt-get install -y lz4 file xz-utils python3 python3-pip

          mkdir -p stock_audit
          : > stock_audit/STOCK_KERNEL_FORENSICS.txt

          {
            echo "=========================================="
            echo "GTA9 STOCK AP KERNEL FORENSICS"
            echo "=========================================="
            echo
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "===== AP FILES PRESENT IN REPOSITORY ====="
            find . -maxdepth 1 -type f -printf "%f %s bytes\\n" | sort
            echo
          } | tee stock_audit/STOCK_KERNEL_FORENSICS.txt

          echo "===== DECOMPRESS LZ4 AP IMAGES =====" | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt

          for f in *.img.lz4; do
            [ -f "$f" ] || continue
            out="${f%.lz4}"
            echo "[LZ4] $f -> $out" | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
            lz4 -f -d "$f" "$out"
            file "$out" | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
          done

          echo | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
          echo "===== EXTRACT ANDROID BOOT TOOLS =====" | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt

          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg android_mkbootimg
          chmod +x android_mkbootimg/unpack_bootimg.py

          echo | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
          echo "===== BOOT.IMG HEADER / PAYLOAD =====" | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt

          if [ -f boot.img ]; then
            mkdir -p stock_audit/boot
            python3 android_mkbootimg/unpack_bootimg.py               --boot_img boot.img               --out stock_audit/boot               2>&1 | tee stock_audit/boot_unpack.log || true

            find stock_audit/boot -maxdepth 2 -type f -printf "%p %s bytes\\n"               | sort | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt

            if [ -f stock_audit/boot/kernel ]; then
              echo | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
              echo "===== STOCK KERNEL FILE =====" | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
              file stock_audit/boot/kernel | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt

              echo | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
              echo "===== STOCK KERNEL STRINGS =====" | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt

              strings -a stock_audit/boot/kernel                 | grep -Ei                   'Linux version|5\\.10\\.205|android|clang|gcc|SMP|PREEMPT|gta9|gta9wifi|mt8781|Samsung|Exynos|KERNEL'                 | head -n 500                 | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt                 || true

              echo | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
              echo "===== KERNEL VERSION CANDIDATES =====" | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt

              strings -a stock_audit/boot/kernel                 | grep -Eo 'Linux version [^[:cntrl:]]+'                 | head -n 20                 | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt                 || true

              sha256sum stock_audit/boot/kernel                 | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
            else
              echo "ERROR: unpack_bootimg did not produce stock_audit/boot/kernel"                 | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
            fi
          else
            echo "ERROR: boot.img is missing after LZ4 extraction"               | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
          fi

          echo | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
          echo "===== VENDOR_BOOT.IMG HEADER / PAYLOAD =====" | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt

          if [ -f vendor_boot.img ]; then
            mkdir -p stock_audit/vendor_boot
            python3 android_mkbootimg/unpack_bootimg.py               --boot_img vendor_boot.img               --out stock_audit/vendor_boot               2>&1 | tee stock_audit/vendor_boot_unpack.log || true

            find stock_audit/vendor_boot -maxdepth 2 -type f               -printf "%p %s bytes\\n"               | sort | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
          else
            echo "vendor_boot.img missing after LZ4 extraction"               | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
          fi

          echo | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
          echo "===== DTBO IMAGE =====" | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt

          if [ -f dtbo.img ]; then
            file dtbo.img | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
            sha256sum dtbo.img | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
            strings -a dtbo.img               | grep -Ei 'gta9|gta9wifi|mt8781|mediatek|model|compatible'               | head -n 300               | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt               || true
          fi

          echo | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
          echo "===== VBMETA IMAGES =====" | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt

          for f in vbmeta.img vbmeta_system.img; do
            if [ -f "$f" ]; then
              echo "--- $f ---" | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
              file "$f" | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
              sha256sum "$f" | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
              strings -a "$f"                 | grep -Ei 'avb|rollback|descriptor|hashtree|hash'                 | head -n 100                 | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt                 || true
            fi
          done

          echo | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt
          echo "===== FORENSICS COMPLETE =====" | tee -a stock_audit/STOCK_KERNEL_FORENSICS.txt

          cat stock_audit/STOCK_KERNEL_FORENSICS.txt

      - name: Upload stock kernel forensics
        uses: actions/upload-artifact@v4
        with:
          name: GTA9-stock-kernel-forensics
          path: |
            stock_audit/STOCK_KERNEL_FORENSICS.txt
            stock_audit/boot_unpack.log
            stock_audit/vendor_boot_unpack.log


      # ============================================================
      # 1. PREPARE HOST
      # ============================================================
      - name: Prepare host
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            build-essential \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            device-tree-compiler

      # ============================================================
      # 2. CLONE GTA9 SOURCE
      # ============================================================
      - name: Clone GTA9 kernel source
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "CLONE GTA9 KERNEL"
          echo "=================================================="

          git clone \
            --branch 15.0 \
            --single-branch \
            https://github.com/prabhatkrmishra/kernel_samsung_gta9.git \
            kernel_samsung_gta9

          cd kernel_samsung_gta9

          echo
          echo "===== COMMIT ====="
          git rev-parse HEAD

          echo
          echo "===== BRANCH ====="
          git branch --show-current

          echo
          echo "===== REMOTE ====="
          git remote -v

      # ============================================================
      # 3. KERNEL VERSION AUDIT
      # ============================================================
      - name: Kernel version audit
        run: |
          set -euo pipefail

          cd kernel_samsung_gta9

          echo "=================================================="
          echo "KERNEL VERSION AUDIT"
          echo "=================================================="

          echo
          echo "===== MAKEFILE VERSION ====="

          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
            Makefile || true

          echo
          echo "===== KERNELVERSION ====="

          make -s kernelversion || true

      # ============================================================
      # 4. EXACT KERNEL + GKI AUDIT
      # ============================================================
      - name: Exact kernel and GKI audit
        run: |
          set -euo pipefail

          cd kernel_samsung_gta9

          echo "=================================================="
          echo "EXACT KERNEL + GKI AUDIT"
          echo "=================================================="

          echo
          echo "===== EXACT KERNEL VERSION ====="

          make -s kernelversion || true

          echo
          echo "===== MAKEFILE VERSION ====="

          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
            Makefile || true

          echo
          echo "===== ARM64 CONFIG TARGETS ====="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*gki*' \
              -o -name '*gta9*' \
            \) \
            -print \
            | sort

          echo
          echo "===== BUILD CONFIG FILES ====="

          find . \
            -type f \
            \( \
              -name 'build.config' \
              -o -name 'build.config.*' \
              -o -name '*.build.config' \
            \) \
            -print \
            | sort

          echo
          echo "===== GKI REFERENCES ====="

          grep -RIn \
            -E \
            'gki_defconfig|GKI|KMI|TRIM_NONLISTED_KMI|KMI_SYMBOL_LIST|ABI' \
            . \
            --exclude-dir=.git \
            2>/dev/null \
            | head -n 300 || true

          echo
          echo "===== GTA9 DEFCONFIG ====="

          if [ -f arch/arm64/configs/gta9_defconfig ]; then
            echo "FOUND: arch/arm64/configs/gta9_defconfig"

            echo
            echo "===== CONFIG_KSU / MODULES / LTO / CLANG ====="

            grep -nE \
              'CONFIG_KSU|CONFIG_MODULES|CONFIG_LTO|CONFIG_LTO_CLANG|CONFIG_CC_IS_CLANG' \
              arch/arm64/configs/gta9_defconfig \
              || true
          else
            echo "NOT FOUND: arch/arm64/configs/gta9_defconfig"
          fi

      # ============================================================
      # 5. DEFCONFIG AUDIT
      # ============================================================
      - name: Defconfig audit
        run: |
          set -euo pipefail

          cd kernel_samsung_gta9

          echo "=================================================="
          echo "DEFCONFIG AUDIT"
          echo "=================================================="

          echo
          echo "===== DEFCONFIG FILES ====="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "===== GTA9 DEFCONFIG ====="

          if [ -f arch/arm64/configs/gta9_defconfig ]; then

            echo "===== SECURITY / KSU / BUILD CONFIG ====="

            grep -E \
              '^(CONFIG_KSU|CONFIG_KNOX|CONFIG_SECURITY_DEFEX|CONFIG_SECURITY_PROCA|CONFIG_SECURITY_SELINUX|CONFIG_LTO|CONFIG_MODULES)' \
              arch/arm64/configs/gta9_defconfig \
              2>/dev/null \
              || true

          else

            echo "gta9_defconfig NOT FOUND"

          fi

      # ============================================================
      # 6. BUILD CONFIG + GKI AUDIT
      # ============================================================
      - name: Build config and GKI audit
        run: |
          set -euo pipefail

          cd kernel_samsung_gta9

          echo "=================================================="
          echo "BUILD CONFIG + GKI AUDIT"
          echo "=================================================="

          echo
          echo "===== BUILD CONFIG FILES ====="

          find . \
            -maxdepth 4 \
            -type f \
            \( \
              -name 'build.config*' \
              -o -name '*.build.config' \
            \) \
            -print \
            | sort

          echo
          echo "===== GKI REFERENCES ====="

          grep -RIn \
            -E \
            'gki_defconfig|GKI|KMI|ABI|TRIM_NONLISTED_KMI' \
            build.config* \
            . \
            --exclude-dir=.git \
            2>/dev/null \
            | head -n 300 \
            || true

      # ============================================================
      # 7. SAMSUNG SECURITY AUDIT
      # ============================================================
      - name: Samsung security audit
        run: |
          set -euo pipefail

          cd kernel_samsung_gta9

          echo "=================================================="
          echo "SAMSUNG SECURITY AUDIT"
          echo "=================================================="

          echo
          echo "===== DEFEX ====="

          grep -RIn \
            -E \
            'CONFIG_SECURITY_DEFEX|task_defex_enforce|defex_lsm' \
            . \
            --exclude-dir=.git \
            2>/dev/null \
            | head -n 150 \
            || true

          echo
          echo "===== KNOX_NCM ====="

          grep -RIn \
            -E \
            'CONFIG_KNOX_NCM|KNOX_NCM' \
            arch/arm64/configs \
            drivers \
            net \
            security \
            2>/dev/null \
            | head -n 150 \
            || true

          echo
          echo "===== PROCA / KDP ====="

          grep -RIn \
            -E \
            'CONFIG_PROCA|CONFIG_KDP|PROCA|KDP' \
            arch/arm64/configs \
            security \
            2>/dev/null \
            | head -n 200 \
            || true

          echo
          echo "===== LEGACY SECURITY SYMBOLS ====="

          grep -RIn \
            -E \
            'CONFIG_SEC_RESTRICT_FORK|CONFIG_SEC_RESTRICT_ROOTMOD|CONFIG_KNOX_KAP|CONFIG_RKP' \
            . \
            --exclude-dir=.git \
            2>/dev/null \
            | head -n 100 \
            || true

      # ============================================================
      # 8. GTA9 DTB / DTBO AUDIT
      # ============================================================
      - name: GTA9 DTB DTBO audit
        run: |
          set -euo pipefail

          cd kernel_samsung_gta9

          echo "=================================================="
          echo "GTA9 DTB / DTBO AUDIT"
          echo "=================================================="

          echo
          echo "===== GTA9 DTS / DTB FILES ====="

          find arch/arm64/boot/dts \
            -type f \
            \( \
              -name '*gta9*' \
              -o -name '*mt8781*' \
              -o -name '*mt6789*' \
            \) \
            -print \
            | sort

          echo
          echo "===== DTBO CONFIG ====="

          grep -RIn \
            -E \
            'BUILD_ARM64_DTB_OVERLAY_IMAGE_NAMES|mt8781_gta9_eur_open_00' \
            arch/arm64/configs \
            2>/dev/null \
            | head -n 100 \
            || true

          echo
          echo "===== PLUGIN DTS ====="

          grep -RIn \
            '/plugin/;' \
            arch/arm64/boot/dts/mediatek \
            2>/dev/null \
            | head -n 100 \
            || true

      # ============================================================
      # 9. KERNELSU / RESUKISU AUDIT
      # ============================================================
      - name: ReSukiSU KernelSU audit
        run: |
          set -euo pipefail

          cd kernel_samsung_gta9

          echo "=================================================="
          echo "KERNELSU / RESUKISU AUDIT"
          echo "=================================================="

          echo
          echo "===== DRIVERS/KERNELSU ====="

          if [ -d drivers/kernelsu ]; then

            echo "FOUND drivers/kernelsu"

            find drivers/kernelsu \
              -maxdepth 2 \
              -type f \
              -print \
              | sort \
              | head -n 200

          else

            echo "NOT FOUND"

          fi

          echo
          echo "===== CONFIG_KSU ====="

          grep -RIn \
            -E \
            'CONFIG_KSU|config KSU' \
            arch/arm64/configs \
            drivers \
            2>/dev/null \
            | head -n 100 \
            || true

          echo
          echo "===== KSU MAKEFILE HOOK ====="

          grep -RIn \
            -E \
            'kernelsu|CONFIG_KSU' \
            drivers/Makefile \
            drivers/Kconfig \
            2>/dev/null \
            || true

          echo
          echo "===== RESUKISU REFERENCES ====="

          grep -RIn \
            -i \
            'resukisu' \
            . \
            --exclude-dir=.git \
            2>/dev/null \
            | head -n 200 \
            || true

      # ============================================================
      # 10. MANUAL HOOK / KERNEL INTEGRATION AUDIT
      # ============================================================
      - name: Kernel hook audit
        run: |
          set -euo pipefail

          cd kernel_samsung_gta9

          echo "=================================================="
          echo "KERNEL HOOK AUDIT"
          echo "=================================================="

          echo
          echo "===== EXEC / CRED / FS HOOK CANDIDATES ====="

          grep -RIn \
            -E \
            'execve|do_execve|prepare_binprm|install_exec_creds|commit_creds|override_creds|revert_creds' \
            fs \
            kernel \
            2>/dev/null \
            | head -n 250 \
            || true

          echo
          echo "===== TASK / CREDENTIAL HOOK CANDIDATES ====="

          grep -RIn \
            -E \
            'task_struct|cred|security_task|security_inode|security_file' \
            kernel \
            security \
            fs \
            2>/dev/null \
            | head -n 250 \
            || true

          echo
          echo "===== SELINUX HOOK REFERENCES ====="

          grep -RIn \
            -E \
            'security_.*cred|security_.*inode|security_.*task' \
            security/selinux \
            2>/dev/null \
            | head -n 200 \
            || true

      # ============================================================
      # 11. SOURCE LOCK REPORT
      # ============================================================
      - name: Generate audit report
        run: |
          set -euo pipefail

          cd kernel_samsung_gta9

          {
            echo "=========================================="
            echo "GTA9 ReSukiSU V2 SOURCE AUDIT"
            echo "=========================================="
            echo

            echo "Repository:"
            echo "https://github.com/prabhatkrmishra/kernel_samsung_gta9.git"
            echo

            echo "Requested branch:"
            echo "15.0"
            echo

            echo "Actual branch:"
            git branch --show-current
            echo

            echo "Commit:"
            git rev-parse HEAD
            echo

            echo "Kernel version:"
            make -s kernelversion 2>/dev/null || true
            echo

            echo "=========================================="
            echo "STAGE STATUS"
            echo "=========================================="
            echo

            echo "Stage 1: SOURCE AUDIT"
            echo "STATUS: RUN"
            echo

            echo "Stage 2: ReSukiSU integration"
            echo "STATUS: NOT STARTED"
            echo

            echo "Stage 3: Kernel build"
            echo "STATUS: NOT STARTED"
            echo

            echo "Stage 4: Preflight"
            echo "STATUS: NOT STARTED"
            echo

            echo "Stage 5: boot.img modification"
            echo "STATUS: NOT STARTED"
            echo

            echo "Stage 6: Final validation"
            echo "STATUS: NOT STARTED"
            echo

            echo "=========================================="
            echo "IMPORTANT"
            echo "=========================================="

            echo "No source modification."
            echo "No ReSukiSU integration."
            echo "No kernel build."
            echo "No boot.img modification."
            echo "No flashing."

          } > ../GTA9_SOURCE_AUDIT.txt

          cat ../GTA9_SOURCE_AUDIT.txt

      # ============================================================
      # 12. UPLOAD AUDIT REPORT
      # ============================================================
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: GTA9-source-audit
          path: GTA9_SOURCE_AUDIT.txt
