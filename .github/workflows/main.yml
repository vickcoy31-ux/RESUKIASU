name: GTA9 ReSukiSU V2 - Stage 1 Source Audit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  GTA9_REPO: https://github.com/prabhatkrmishra/kernel_samsung_gta9.git
  GTA9_BRANCH: 15.0

jobs:
  source-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare host
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            build-essential \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            device-tree-compiler

      - name: Clone GTA9 kernel source
        run: |
          set -euo pipefail

          echo "===== CLONE GTA9 15.0 ====="

          git clone \
            --branch 15.0 \
            --single-branch \
            https://github.com/prabhatkrmishra/kernel_samsung_gta9.git \
            kernel_samsung_gta9

          cd kernel_samsung_gta9

          echo "===== COMMIT ====="
          git rev-parse HEAD

          echo "===== BRANCH ====="
          git branch --show-current

          echo "===== REMOTE ====="
          git remote -v

      - name: Kernel version audit
        run: |
          set -euo pipefail
          cd kernel_samsung_gta9

          echo "===== KERNEL VERSION ====="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' Makefile || true

      - name: Defconfig audit
        run: |
          set -euo pipefail
          cd kernel_samsung_gta9

          echo "===== DEFCONFIG FILES ====="
          find arch/arm64/configs -maxdepth 1 -type f \
            -printf '%f\n' | sort

          echo "===== GTA9 DEFCONFIG ====="

          if [ -f arch/arm64/configs/gta9_defconfig ]; then
            grep -E \
              '^(CONFIG_KSU|CONFIG_KNOX|CONFIG_SECURITY_DEFEX|CONFIG_SECURITY_PROCA|CONFIG_SECURITY_SELINUX|CONFIG_LTO|CONFIG_MODULES)' \
              arch/arm64/configs/gta9_defconfig \
              2>/dev/null || true
          fi

      - name: Build config and GKI audit
        run: |
          set -euo pipefail
          cd kernel_samsung_gta9

          echo "===== BUILD CONFIG FILES ====="
          find . -maxdepth 3 -type f \
            \( -name 'build.config*' -o -name '*.build.config' \) \
            -print | sort

          echo
          echo "===== GKI REFERENCES ====="
          grep -RIn \
            -E 'gki_defconfig|GKI|KMI|ABI|TRIM_NONLISTED_KMI' \
            build.config* . \
            2>/dev/null | head -n 200 || true

      - name: Samsung security audit
        run: |
          set -euo pipefail
          cd kernel_samsung_gta9

          echo "===== DEFEX ====="
          grep -RIn \
            -E 'CONFIG_SECURITY_DEFEX|task_defex_enforce|defex_lsm' \
            . \
            2>/dev/null | head -n 150 || true

          echo
          echo "===== KNOX_NCM ====="
          grep -RIn \
            -E 'CONFIG_KNOX_NCM|KNOX_NCM' \
            arch/arm64/configs drivers net security \
            2>/dev/null | head -n 150 || true

          echo
          echo "===== PROCA / KDP ====="
          grep -RIn \
            -E 'CONFIG_PROCA|CONFIG_KDP|PROCA|KDP' \
            arch/arm64/configs security \
            2>/dev/null | head -n 200 || true

          echo
          echo "===== LEGACY SECURITY SYMBOLS ====="
          grep -RIn \
            -E 'CONFIG_SEC_RESTRICT_FORK|CONFIG_SEC_RESTRICT_ROOTMOD|CONFIG_KNOX_KAP|CONFIG_RKP' \
            . \
            2>/dev/null | head -n 100 || true

      - name: GTA9 DTB DTBO audit
        run: |
          set -euo pipefail
          cd kernel_samsung_gta9

          echo "===== GTA9 DTS ====="
          find arch/arm64/boot/dts \
            -type f \
            \( -name '*gta9*' -o -name '*mt8781*' -o -name '*mt6789*' \) \
            -print | sort

          echo
          echo "===== DTBO CONFIG ====="
          grep -RIn \
            -E 'BUILD_ARM64_DTB_OVERLAY_IMAGE_NAMES|mt8781_gta9_eur_open_00' \
            arch/arm64/configs \
            2>/dev/null | head -n 100 || true

          echo
          echo "===== PLUGIN DTS ====="
          grep -RIn \
            '/plugin/;' \
            arch/arm64/boot/dts/mediatek \
            2>/dev/null | head -n 100 || true

      - name: ReSukiSU KernelSU audit
        run: |
          set -euo pipefail
          cd kernel_samsung_gta9

          echo "===== DRIVERS/KERNELSU ====="

          if [ -d drivers/kernelsu ]; then
            echo "FOUND drivers/kernelsu"
            find drivers/kernelsu -maxdepth 2 -type f \
              -print | sort | head -n 200
          else
            echo "NOT FOUND"
          fi

          echo
          echo "===== CONFIG_KSU ====="
          grep -RIn \
            -E 'CONFIG_KSU|config KSU' \
            arch/arm64/configs drivers \
            2>/dev/null | head -n 100 || true

          echo
          echo "===== RESUKISU ====="
          grep -RIn \
            -i 'resukisu' \
            . \
            2>/dev/null | head -n 200 || true

      - name: Generate audit report
        run: |
          set -euo pipefail

          cd kernel_samsung_gta9

          {
            echo "=========================================="
            echo "GTA9 ReSukiSU V2 SOURCE AUDIT"
            echo "=========================================="
            echo
            echo "Repository:"
            echo "https://github.com/prabhatkrmishra/kernel_samsung_gta9.git"
            echo
            echo "Branch:"
            echo "15.0"
            echo
            echo "Commit:"
            git rev-parse HEAD
            echo
            echo "Actual branch:"
            git branch --show-current
            echo
            echo "=========================================="
            echo "AUDIT ONLY"
            echo "=========================================="
            echo "No source modification."
            echo "No ReSukiSU integration."
            echo "No kernel build."
            echo "No boot.img modification."
            echo "No flashing."
          } > ../GTA9_SOURCE_AUDIT.txt

          cat ../GTA9_SOURCE_AUDIT.txt

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: GTA9-source-audit
          path: GTA9_SOURCE_AUDIT.txt
