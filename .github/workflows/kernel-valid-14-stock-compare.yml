name: GTA9 14.0 - Stock 5.10.205 Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kernel-valid-14-stock-compare.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: gta9-14-stock-validation
  cancel-in-progress: false

env:
  GTA9_REPO: https://github.com/prabhatkrmishra/kernel_samsung_gta9.git
  GTA9_BRANCH: "14.0"
  STOCK_RUN_ID: "36024263408"
  STOCK_ARTIFACT: RESUKISU-V2-stock-510205-deep-compare

jobs:
  validate:
    name: Source + config + build + stock comparison
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout validation repo
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y             bc bison flex build-essential git curl python3 cpio rsync             libssl-dev libelf-dev libncurses5-dev device-tree-compiler             gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu             lz4 xz-utils file gzip

      - name: Download exact stock artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.STOCK_ARTIFACT }}
          run-id: ${{ env.STOCK_RUN_ID }}
          github-token: ${{ github.token }}
          path: stock_reference

      - name: Validate stock artifact layout
        shell: bash
        run: |
          set -euo pipefail
          find stock_reference -maxdepth 6 -type f -printf '%p\n' | sort

          STOCK_CONFIG="$(find stock_reference -type f -name stock.config -print -quit)"
          STOCK_KERNEL="$(find stock_reference -type f -path '*/boot/kernel' -print -quit)"
          STOCK_DTB="$(find stock_reference -type f -path '*/vendor_boot/dtb' -print -quit)"

          test -n "$STOCK_CONFIG" || { echo "ERROR: stock.config missing"; exit 1; }
          test -n "$STOCK_KERNEL" || { echo "ERROR: boot/kernel missing"; exit 1; }
          test -n "$STOCK_DTB" || { echo "ERROR: vendor_boot/dtb missing"; exit 1; }

          {
            echo "STOCK_CONFIG=$STOCK_CONFIG"
            echo "STOCK_KERNEL=$STOCK_KERNEL"
            echo "STOCK_DTB=$STOCK_DTB"
          } >> "$GITHUB_ENV"

          file "$STOCK_CONFIG" "$STOCK_KERNEL" "$STOCK_DTB"
          sha256sum "$STOCK_CONFIG" "$STOCK_KERNEL" "$STOCK_DTB"

      - name: Clone and lock GTA9 14.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch "$GTA9_BRANCH" --single-branch --recurse-submodules             "$GTA9_REPO" kernel_samsung_gta9
          cd kernel_samsung_gta9

          SOURCE_COMMIT="$(git rev-parse HEAD)"
          KERNEL_VERSION="$(make -s kernelversion)"

          {
            echo "Repository: $GTA9_REPO"
            echo "Branch: $GTA9_BRANCH"
            echo "Commit: $SOURCE_COMMIT"
            echo "Kernel version: $KERNEL_VERSION"
          } | tee ../SOURCE_14_LOCK.txt

          test "$KERNEL_VERSION" = "5.10.205"

      - name: Verify source identity and required GTA9 WiFi files
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_samsung_gta9

          test -f arch/arm64/configs/gta9_defconfig
          test -f arch/arm64/boot/dts/mediatek/mt8781_gta9_eur_open_00.dts
          test -f arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dts

          grep -q 'Linux/arm64 5.10.205 Kernel Configuration' arch/arm64/configs/gta9_defconfig
          grep -q 'CONFIG_CC_VERSION_TEXT="Android (7284624, based on r416183b)' arch/arm64/configs/gta9_defconfig
          grep -q 'CONFIG_ARCH_MEDIATEK=y' arch/arm64/configs/gta9_defconfig
          grep -q 'CONFIG_CUSTOM_PROJECT_OT11=y' arch/arm64/configs/gta9_defconfig

          grep -q 'Samsung,GTA9 WiFi EUR OPEN 00'             arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dts
          grep -q 'Mediatek,MT8781'             arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dts

          echo "===== SOURCE DEVICE IDENTITY ====="
          grep -E 'CONFIG_(CUSTOM_PROJECT_OT11|CUSTOM_PROJECT_OT11_WIFI|ARCH_MEDIATEK|CC_VERSION_TEXT)='             arch/arm64/configs/gta9_defconfig || true
          grep -E 'compatible =|model ='             arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dts || true

      - name: Install exact source Clang r416183b
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain
          curl -L --fail --retry 3             "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.1.0_r7/clang-r416183b.tar.gz"             -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C toolchain

          if [ -x toolchain/clang-r416183b/bin/clang ]; then
            CLANG_DIR="$PWD/toolchain/clang-r416183b"
          elif [ -x toolchain/bin/clang ]; then
            CLANG_DIR="$PWD/toolchain"
          else
            echo "ERROR: clang-r416183b not found"
            exit 1
          fi

          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          "$CLANG_DIR/bin/clang" --version
          "$CLANG_DIR/bin/ld.lld" --version

      - name: Build source-native GTA9 WiFi configuration
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_samsung_gta9
          export PATH="$CLANG_DIR/bin:$PATH"

          rm -f .config
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gta9_defconfig

          cp .config ../CONFIG_GTA9_BASE.config

          test -f kernel/configs/entry_level.config
          test -f kernel/configs/ot11.config
          test -f kernel/configs/ot11_wifi.config

          scripts/kconfig/merge_config.sh -m -r .config             kernel/configs/entry_level.config             kernel/configs/ot11.config             kernel/configs/ot11_wifi.config

          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          cp .config ../CONFIG_GTA9_WIFI_FINAL.config

          grep -q '^CONFIG_CUSTOM_PROJECT_OT11=y$' .config
          grep -q '^CONFIG_CUSTOM_PROJECT_OT11_WIFI=y$' .config
          grep -q '^CONFIG_ARCH_MEDIATEK=y$' .config
          grep -q '^CONFIG_MTK_DTBO_FEATURE=y

          echo "===== FINAL SOURCE CONFIG ====="
          grep -E '^(CONFIG_CUSTOM_PROJECT_OT11|CONFIG_CUSTOM_PROJECT_OT11_WIFI|CONFIG_ARCH_MEDIATEK|CONFIG_MTK_DTBO_FEATURE|CONFIG_BUILD_ARM64_DTB_IMAGE_NAMES|CONFIG_BUILD_ARM64_DTB_OVERLAY_IMAGE_NAMES|CONFIG_CC_VERSION_TEXT)=' .config || true

      - name: Compare stock config with source config
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "Stock artifact run: $STOCK_RUN_ID"
            echo "Stock artifact name: $STOCK_ARTIFACT"
            echo "Stock config: $STOCK_CONFIG"
            echo "Stock kernel: $STOCK_KERNEL"
            echo "Stock vendor_boot DTB: $STOCK_DTB"
          } | tee STOCK_REFERENCE.txt

          echo "===== RAW STOCK CONFIG ====="
          grep -E '^(CONFIG_CC_VERSION_TEXT|CONFIG_CLANG_VERSION|CONFIG_LLD_VERSION|CONFIG_ARCH_MEDIATEK|CONFIG_CUSTOM_PROJECT_OT11|CONFIG_CUSTOM_PROJECT_OT11_WIFI|CONFIG_MTK_DTBO_FEATURE|CONFIG_BUILD_ARM64_DTB_IMAGE_NAMES|CONFIG_BUILD_ARM64_DTB_OVERLAY_IMAGE_NAMES)='             "$STOCK_CONFIG" || true

          echo
          echo "===== SOURCE CONFIG ====="
          grep -E '^(CONFIG_CC_VERSION_TEXT|CONFIG_CLANG_VERSION|CONFIG_LLD_VERSION|CONFIG_ARCH_MEDIATEK|CONFIG_CUSTOM_PROJECT_OT11|CONFIG_CUSTOM_PROJECT_OT11_WIFI|CONFIG_MTK_DTBO_FEATURE|CONFIG_BUILD_ARM64_DTB_IMAGE_NAMES|CONFIG_BUILD_ARM64_DTB_OVERLAY_IMAGE_NAMES)='             CONFIG_GTA9_WIFI_FINAL.config || true

          diff -u "$STOCK_CONFIG" CONFIG_GTA9_WIFI_FINAL.config > CONFIG_STOCK_VS_SOURCE.diff || true

          echo "===== CONFIG DIFF SUMMARY ====="
          if [ -s CONFIG_STOCK_VS_SOURCE.diff ]; then
            grep -E '^[+-]CONFIG_|^[+-]# CONFIG_' CONFIG_STOCK_VS_SOURCE.diff | head -n 200 || true
          else
            echo "No config differences."
          fi

      - name: Test stock config compatibility separately
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_samsung_gta9
          export PATH="$CLANG_DIR/bin:$PATH"

          cp "$STOCK_CONFIG" .config
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          cp .config ../CONFIG_STOCK_ACCEPTED_BY_SOURCE.config

          echo "===== STOCK CONFIG AFTER SOURCE olddefconfig ====="
          grep -E '^(CONFIG_ARCH_MEDIATEK|CONFIG_CUSTOM_PROJECT_OT11|CONFIG_CUSTOM_PROJECT_OT11_WIFI|CONFIG_CC_VERSION_TEXT)=' .config || true

          diff -u "$STOCK_CONFIG" .config > ../CONFIG_STOCK_NORMALIZATION.diff || true

      - name: Build source-native GTA9 WiFi kernel
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_samsung_gta9
          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-

          cp ../CONFIG_GTA9_WIFI_FINAL.config .config

          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1             CROSS_COMPILE=aarch64-linux-gnu- Image.gz

          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            arch/arm64/boot/dts/mediatek/mt8781_gta9_eur_open_00.dtb \
            arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dtb

          test -s arch/arm64/boot/Image.gz
          test -s arch/arm64/boot/dts/mediatek/mt8781_gta9_eur_open_00.dtb
          test -s arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dtb
          test -s vmlinux

      - name: Forensic kernel and DTB comparison
        shell: bash
        run: |
          set -euo pipefail
          BUILT=kernel_samsung_gta9
          mkdir -p forensic

          gzip -dc "$BUILT/arch/arm64/boot/Image.gz" > forensic/built.Image

          {
            echo "===== SOURCE ====="
            cd "$BUILT"
            git rev-parse HEAD
            make -s kernelversion
            echo
            echo "===== BUILT KERNEL ====="
            file arch/arm64/boot/Image.gz vmlinux
            strings -a ../forensic/built.Image | grep -E 'Linux version|5\.10\.' | head -n 20 || true
            echo
            echo "===== STOCK KERNEL ====="
            file "$STOCK_KERNEL"
            strings -a "$STOCK_KERNEL" | grep -E 'Linux version|5\.10\.' | head -n 20 || true
          } | tee forensic/KERNEL_IDENTITY.txt

          echo "===== DTB MAGIC / OFFSETS IN STOCK VENDOR_BOOT DTB =====" | tee forensic/STOCK_DTB_LAYOUT.txt
          python3 - "$STOCK_DTB" <<'PY' | tee -a forensic/STOCK_DTB_LAYOUT.txt
import sys, struct
p=sys.argv[1]
b=open(p,'rb').read()
magic=b'\xd0\x0d\xfe\xed'
offs=[]
i=0
while True:
    i=b.find(magic,i)
    if i<0: break
    if i+8<=len(b):
        size=struct.unpack('>I',b[i+4:i+8])[0]
        if size >= 40 and i+size <= len(b):
            offs.append((i,size))
    i+=4
print("size:",len(b))
print("valid_fdt_blobs:",len(offs))
for n,(off,size) in enumerate(offs):
    print(f"{n}: offset={off} size={size}")
PY

          echo "===== BUILT BASE DTB =====" | tee forensic/BUILT_BASE_DTB.txt
          dtc -I dtb -O dts \
            "$BUILT/arch/arm64/boot/dts/mediatek/mt8781_gta9_eur_open_00.dtb" \
            > forensic/built_base.dts 2> forensic/built_base_dtc.err
          grep -E 'compatible =|model =' forensic/built_base.dts | head -n 40 | tee -a forensic/BUILT_BASE_DTB.txt

          echo "===== BUILT WIFI DTB =====" | tee forensic/BUILT_WIFI_DTB.txt
          dtc -I dtb -O dts \
            "$BUILT/arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dtb" \
            > forensic/built_wifi.dts 2> forensic/built_wifi_dtc.err
          grep -E 'compatible =|model =' forensic/built_wifi.dts | head -n 40 | tee -a forensic/BUILT_WIFI_DTB.txt

          echo "===== SEARCH STOCK DTB BLOBS FOR GTA9/MT8781 =====" | tee forensic/STOCK_DTB_MATCHES.txt
          python3 - "$STOCK_DTB" <<'PY'
import sys, struct, subprocess, tempfile, os
p=sys.argv[1]
b=open(p,'rb').read()
magic=b'\xd0\x0d\xfe\xed'
n=0
i=0
while True:
    i=b.find(magic,i)
    if i<0: break
    if i+8<=len(b):
        size=struct.unpack('>I',b[i+4:i+8])[0]
        if 40 <= size <= len(b)-i:
            blob=b[i:i+size]
            fn=f"/tmp/stock_{n}.dtb"
            open(fn,'wb').write(blob)
            r=subprocess.run(["dtc","-I","dtb","-O","dts",fn],capture_output=True,text=True)
            if r.returncode==0:
                text=r.stdout
                hits=[x.strip() for x in text.splitlines()
                      if any(k in x for k in ["compatible =","model ="])
                      and any(k.lower() in x.lower() for k in ["gta9","mt8781","samsung"])]
                if hits:
                    print(f"blob={n} offset={i} size={size}")
                    print("\n".join(hits[:30]))
            n+=1
    i+=4
PY

          echo "===== HASHES =====" | tee forensic/SHA256.txt
          sha256sum \
            "$BUILT/arch/arm64/boot/Image.gz" \
            "$BUILT/arch/arm64/boot/dts/mediatek/mt8781_gta9_eur_open_00.dtb" \
            "$BUILT/arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dtb" \
            "$STOCK_KERNEL" \
            "$STOCK_DTB" | tee -a forensic/SHA256.txt

      - name: Write validation result
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git -C kernel_samsung_gta9 rev-parse HEAD)"
          SOURCE_VERSION="$(git -C kernel_samsung_gta9 describe --always --dirty 2>/dev/null || true)"

          cat > VALIDATION_14_RESULT.txt <<EOF
GTA9 14.0 VALIDATION
====================
Source repo : $GTA9_REPO
Branch      : $GTA9_BRANCH
Commit      : $SOURCE_COMMIT
Kernel      : 5.10.205
Target      : GTA9 WiFi / MT8781 / EUR OPEN 00

CHECKS
------
Source Makefile/kernelversion       : PASS
Source defconfig identity           : PASS
GTA9 WiFi DTS identity              : PASS
Source-native WiFi config generated : PASS
Stock config accepted by source     : PASS
Source-native Image.gz build        : PASS
Source-native GTA9 base DTB build  : PASS
Source-native GTA9 WiFi DTB build  : PASS
Stock kernel/DTB forensic inspection: PASS

IMPORTANT
---------
This workflow does NOT modify kernel functionality.
It does NOT add ReSukiSU/KernelSU.
Stock config comparison is informational; source-native WiFi config is the build configuration.
Binary SHA equality is not expected from a normal rebuild.
See CONFIG_STOCK_VS_SOURCE.diff and forensic/ for detailed evidence.
EOF

          echo "===== FINAL RESULT ====="
          cat VALIDATION_14_RESULT.txt

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: GTA9-14.0-STOCK-VALIDATION
          if-no-files-found: error
          path: |
            SOURCE_14_LOCK.txt
            STOCK_REFERENCE.txt
            CONFIG_GTA9_BASE.config
            CONFIG_GTA9_WIFI_FINAL.config
            CONFIG_STOCK_VS_SOURCE.diff
            CONFIG_STOCK_ACCEPTED_BY_SOURCE.config
            CONFIG_STOCK_NORMALIZATION.diff
            VALIDATION_14_RESULT.txt
            forensic/
            kernel_samsung_gta9/arch/arm64/boot/Image.gz
            kernel_samsung_gta9/arch/arm64/boot/dts/mediatek/mt8781_gta9_eur_open_00.dtb
            kernel_samsung_gta9/arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dtb
 .config
          grep -q '^CONFIG_BUILD_ARM64_DTB_OVERLAY_IMAGE=y

          echo "===== FINAL SOURCE CONFIG ====="
          grep -E '^(CONFIG_CUSTOM_PROJECT_OT11|CONFIG_CUSTOM_PROJECT_OT11_WIFI|CONFIG_ARCH_MEDIATEK|CONFIG_MTK_DTBO_FEATURE|CONFIG_BUILD_ARM64_DTB_IMAGE_NAMES|CONFIG_BUILD_ARM64_DTB_OVERLAY_IMAGE_NAMES|CONFIG_CC_VERSION_TEXT)=' .config || true

      - name: Compare stock config with source config
        shell: bash
        run: |
          set -euo pipefail

          echo "===== RAW STOCK CONFIG ====="
          grep -E '^(CONFIG_CC_VERSION_TEXT|CONFIG_CLANG_VERSION|CONFIG_LLD_VERSION|CONFIG_ARCH_MEDIATEK|CONFIG_CUSTOM_PROJECT_OT11|CONFIG_CUSTOM_PROJECT_OT11_WIFI|CONFIG_MTK_DTBO_FEATURE|CONFIG_BUILD_ARM64_DTB_IMAGE_NAMES|CONFIG_BUILD_ARM64_DTB_OVERLAY_IMAGE_NAMES)='             "$STOCK_CONFIG" || true

          echo
          echo "===== SOURCE CONFIG ====="
          grep -E '^(CONFIG_CC_VERSION_TEXT|CONFIG_CLANG_VERSION|CONFIG_LLD_VERSION|CONFIG_ARCH_MEDIATEK|CONFIG_CUSTOM_PROJECT_OT11|CONFIG_CUSTOM_PROJECT_OT11_WIFI|CONFIG_MTK_DTBO_FEATURE|CONFIG_BUILD_ARM64_DTB_IMAGE_NAMES|CONFIG_BUILD_ARM64_DTB_OVERLAY_IMAGE_NAMES)='             CONFIG_GTA9_WIFI_FINAL.config || true

          diff -u "$STOCK_CONFIG" CONFIG_GTA9_WIFI_FINAL.config > CONFIG_STOCK_VS_SOURCE.diff || true

          echo "===== CONFIG DIFF SUMMARY ====="
          if [ -s CONFIG_STOCK_VS_SOURCE.diff ]; then
            grep -E '^[+-]CONFIG_|^[+-]# CONFIG_' CONFIG_STOCK_VS_SOURCE.diff | head -n 200 || true
          else
            echo "No config differences."
          fi

      - name: Test stock config compatibility separately
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_samsung_gta9
          export PATH="$CLANG_DIR/bin:$PATH"

          cp "$STOCK_CONFIG" .config
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          cp .config ../CONFIG_STOCK_ACCEPTED_BY_SOURCE.config

          echo "===== STOCK CONFIG AFTER SOURCE olddefconfig ====="
          grep -E '^(CONFIG_ARCH_MEDIATEK|CONFIG_CUSTOM_PROJECT_OT11|CONFIG_CUSTOM_PROJECT_OT11_WIFI|CONFIG_CC_VERSION_TEXT)=' .config || true

          diff -u "$STOCK_CONFIG" .config > ../CONFIG_STOCK_NORMALIZATION.diff || true

      - name: Build source-native GTA9 WiFi kernel
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_samsung_gta9
          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-

          cp ../CONFIG_GTA9_WIFI_FINAL.config .config

          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1             CROSS_COMPILE=aarch64-linux-gnu- Image.gz

          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1             CROSS_COMPILE=aarch64-linux-gnu-             mt8781_gta9wifi_eur_open_00.dtb

          test -s arch/arm64/boot/Image.gz
          test -s arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dtb
          test -s vmlinux

      - name: Forensic kernel and DTB comparison
        shell: bash
        run: |
          set -euo pipefail
          BUILT=kernel_samsung_gta9
          mkdir -p forensic

          gzip -dc "$BUILT/arch/arm64/boot/Image.gz" > forensic/built.Image

          {
            echo "===== SOURCE ====="
            cd "$BUILT"
            git rev-parse HEAD
            make -s kernelversion
            echo
            echo "===== BUILT KERNEL ====="
            file arch/arm64/boot/Image.gz vmlinux
            strings -a ../forensic/built.Image | grep -E 'Linux version|5\.10\.' | head -n 20 || true
            echo
            echo "===== STOCK KERNEL ====="
            file "$STOCK_KERNEL"
            strings -a "$STOCK_KERNEL" | grep -E 'Linux version|5\.10\.' | head -n 20 || true
          } | tee forensic/KERNEL_IDENTITY.txt

          echo "===== DTB MAGIC / OFFSETS IN STOCK VENDOR_BOOT DTB =====" | tee forensic/STOCK_DTB_LAYOUT.txt
          python3 - "$STOCK_DTB" <<'PY' | tee -a forensic/STOCK_DTB_LAYOUT.txt
import sys, struct
p=sys.argv[1]
b=open(p,'rb').read()
magic=b'\xd0\x0d\xfe\xed'
offs=[]
i=0
while True:
    i=b.find(magic,i)
    if i<0: break
    if i+8<=len(b):
        size=struct.unpack('>I',b[i+4:i+8])[0]
        if size >= 40 and i+size <= len(b):
            offs.append((i,size))
    i+=4
print("size:",len(b))
print("valid_fdt_blobs:",len(offs))
for n,(off,size) in enumerate(offs):
    print(f"{n}: offset={off} size={size}")
PY

          echo "===== BUILT DTB =====" | tee forensic/BUILT_DTB.txt
          dtc -I dtb -O dts             "$BUILT/arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dtb"             > forensic/built.dts 2> forensic/built_dtc.err

          grep -E 'compatible =|model =' forensic/built.dts | head -n 40 | tee -a forensic/BUILT_DTB.txt

          echo "===== SEARCH STOCK DTB BLOBS FOR GTA9/MT8781 =====" | tee forensic/STOCK_DTB_MATCHES.txt
          python3 - "$STOCK_DTB" <<'PY'
import sys, struct, subprocess, tempfile, os
p=sys.argv[1]
b=open(p,'rb').read()
magic=b'\xd0\x0d\xfe\xed'
n=0
i=0
while True:
    i=b.find(magic,i)
    if i<0: break
    if i+8<=len(b):
        size=struct.unpack('>I',b[i+4:i+8])[0]
        if 40 <= size <= len(b)-i:
            blob=b[i:i+size]
            fn=f"/tmp/stock_{n}.dtb"
            open(fn,'wb').write(blob)
            r=subprocess.run(["dtc","-I","dtb","-O","dts",fn],capture_output=True,text=True)
            if r.returncode==0:
                text=r.stdout
                hits=[x.strip() for x in text.splitlines()
                      if any(k in x for k in ["compatible =","model ="])
                      and any(k.lower() in x.lower() for k in ["gta9","mt8781","samsung"])]
                if hits:
                    print(f"blob={n} offset={i} size={size}")
                    print("\n".join(hits[:30]))
            n+=1
    i+=4
PY

          echo "===== HASHES =====" | tee forensic/SHA256.txt
          sha256sum             "$BUILT/arch/arm64/boot/Image.gz"             "$BUILT/arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dtb"             "$STOCK_KERNEL"             "$STOCK_DTB" | tee -a forensic/SHA256.txt

      - name: Write validation result
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git -C kernel_samsung_gta9 rev-parse HEAD)"
          SOURCE_VERSION="$(git -C kernel_samsung_gta9 describe --always --dirty 2>/dev/null || true)"

          cat > VALIDATION_14_RESULT.txt <<EOF
GTA9 14.0 VALIDATION
====================
Source repo : $GTA9_REPO
Branch      : $GTA9_BRANCH
Commit      : $SOURCE_COMMIT
Kernel      : 5.10.205
Target      : GTA9 WiFi / MT8781 / EUR OPEN 00

CHECKS
