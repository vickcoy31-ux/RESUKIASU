name: GTA9 14.0 - Stock Safety Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kernel-valid-14-stock-compare.yml"
      - ".github/workflows/kintil.yml"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: GTA9 14 safety core
    uses: ./.github/workflows/kintil.yml
    with:
      flash_requested: false
    permissions:
      contents: read
      actions: read
