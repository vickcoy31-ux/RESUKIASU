name: kintil

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kintil.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: gta9-kintil-14-stock
  cancel-in-progress: false

env:
  GTA9_REPO: https://github.com/prabhatkrmishra/kernel_samsung_gta9.git
  GTA9_BRANCH: "14.0"
  STOCK_RUN_ID: "36024263408"
  STOCK_ARTIFACT: RESUKISU-V2-stock-510205-deep-compare

jobs:
  validate:
    name: GTA9 14.0 / 5.10.205 vs stock
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout RESUKIASU
        uses: actions/checkout@v4

      - name: Install build and inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential git curl python3 cpio rsync \
            libssl-dev libelf-dev libncurses5-dev device-tree-compiler \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            lz4 xz-utils file gzip

      - name: Download exact stock reference artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.STOCK_ARTIFACT }}
          run-id: ${{ env.STOCK_RUN_ID }}
          github-token: ${{ github.token }}
          path: stock_reference

      - name: Validate stock reference layout
        shell: bash
        run: |
          set -euo pipefail
          find stock_reference -maxdepth 8 -type f -print | sort

          STOCK_CONFIG="$(find stock_reference -type f -name stock.config -print -quit)"
          STOCK_KERNEL="$(find stock_reference -type f -path '*/boot/kernel' -print -quit)"
          STOCK_DTB="$(find stock_reference -type f -path '*/vendor_boot/dtb' -print -quit)"

          test -n "$STOCK_CONFIG" || { echo "ERROR: stock.config missing"; exit 1; }
          test -n "$STOCK_KERNEL" || { echo "ERROR: boot/kernel missing"; exit 1; }
          test -n "$STOCK_DTB" || { echo "ERROR: vendor_boot/dtb missing"; exit 1; }

          {
            echo "STOCK_CONFIG=$STOCK_CONFIG"
            echo "STOCK_KERNEL=$STOCK_KERNEL"
            echo "STOCK_DTB=$STOCK_DTB"
          } >> "$GITHUB_ENV"

          {
            echo "Stock run    : $STOCK_RUN_ID"
            echo "Stock artifact: $STOCK_ARTIFACT"
            echo "Config       : $STOCK_CONFIG"
            echo "Kernel       : $STOCK_KERNEL"
            echo "Vendor DTB   : $STOCK_DTB"
          } | tee STOCK_REFERENCE.txt

          file "$STOCK_CONFIG" "$STOCK_KERNEL" "$STOCK_DTB"
          sha256sum "$STOCK_CONFIG" "$STOCK_KERNEL" "$STOCK_DTB"

      - name: Clone exact GTA9 14.0 source
        shell: bash
        run: |
          set -euo pipefail
          git clone \
            --depth 1 \
            --branch "$GTA9_BRANCH" \
            --single-branch \
            --recurse-submodules \
            "$GTA9_REPO" \
            kernel_samsung_gta9
          cd kernel_samsung_gta9

          test -f .gitmodules
          git submodule status --recursive
          test -f KernelSU/kernel/Kconfig
          test -f drivers/kernelsu/Kconfig

          SOURCE_COMMIT="$(git rev-parse HEAD)"
          KERNEL_VERSION="$(make -s kernelversion)"

          {
            echo "Repository: $GTA9_REPO"
            echo "Branch: $GTA9_BRANCH"
            echo "Commit: $SOURCE_COMMIT"
            echo "Kernel version: $KERNEL_VERSION"
          } | tee ../SOURCE_14_LOCK.txt

          test "$KERNEL_VERSION" = "5.10.205"

      - name: Verify GTA9 source identity and DTS
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_samsung_gta9

          test -f arch/arm64/configs/gta9_defconfig
          test -f arch/arm64/boot/dts/mediatek/mt8781_gta9_eur_open_00.dts
          test -f arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dts

          grep -q 'Linux/arm64 5.10.205 Kernel Configuration' arch/arm64/configs/gta9_defconfig
          grep -q 'CONFIG_ARCH_MEDIATEK=y' arch/arm64/configs/gta9_defconfig
          grep -q 'CONFIG_CUSTOM_PROJECT_OT11=y' arch/arm64/configs/gta9_defconfig

          grep -q 'Samsung,GTA9 WiFi EUR OPEN 00' \
            arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dts
          grep -q 'Mediatek,MT8781' \
            arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dts

          echo "===== SOURCE IDENTITY ====="
          grep -E '^(CONFIG_ARCH_MEDIATEK|CONFIG_CUSTOM_PROJECT_OT11|CONFIG_CUSTOM_PROJECT_OT11_WIFI|CONFIG_CC_VERSION_TEXT)=' \
            arch/arm64/configs/gta9_defconfig || true
          grep -E 'compatible =|model =' \
            arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dts || true

      - name: Install exact Clang r416183b
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain
          curl -L --fail --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.1.0_r7/clang-r416183b.tar.gz" \
            -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C toolchain

          if [ -x toolchain/clang-r416183b/bin/clang ]; then
            CLANG_DIR="$PWD/toolchain/clang-r416183b"
          elif [ -x toolchain/bin/clang ]; then
            CLANG_DIR="$PWD/toolchain"
          else
            echo "ERROR: clang-r416183b not found"
            exit 1
          fi

          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          "$CLANG_DIR/bin/clang" --version
          "$CLANG_DIR/bin/ld.lld" --version

      - name: Generate source-native WiFi config
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_samsung_gta9
          export PATH="$CLANG_DIR/bin:$PATH"

          rm -f .config
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gta9_defconfig
          cp .config ../CONFIG_GTA9_BASE.config

          test -f kernel/configs/entry_level.config
          test -f kernel/configs/ot11.config
          test -f kernel/configs/ot11_wifi.config

          scripts/kconfig/merge_config.sh -m -r .config \
            kernel/configs/entry_level.config \
            kernel/configs/ot11.config \
            kernel/configs/ot11_wifi.config

          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          cp .config ../CONFIG_GTA9_WIFI_FINAL.config

          grep -q '^CONFIG_ARCH_MEDIATEK=y$' .config
          grep -q '^CONFIG_CUSTOM_PROJECT_OT11=y$' .config
          grep -q '^CONFIG_CUSTOM_PROJECT_OT11_WIFI=y$' .config
          grep -q '^CONFIG_MTK_DTBO_FEATURE=y$' .config
          grep -q '^CONFIG_BUILD_ARM64_DTB_OVERLAY_IMAGE=y$' .config
          grep -q '^CONFIG_BUILD_ARM64_DTB_OVERLAY_IMAGE_NAMES="mediatek/mt8781_gta9_eur_open_00"' .config

          echo "===== FINAL SOURCE CONFIG ====="
          grep -E '^(CONFIG_ARCH_MEDIATEK|CONFIG_CUSTOM_PROJECT_OT11|CONFIG_CUSTOM_PROJECT_OT11_WIFI|CONFIG_MTK_DTBO_FEATURE|CONFIG_BUILD_ARM64_DTB_IMAGE_NAMES|CONFIG_BUILD_ARM64_DTB_OVERLAY_IMAGE_NAMES|CONFIG_CC_VERSION_TEXT)=' .config || true

      - name: Compare stock config with source config
        shell: bash
        run: |
          set -euo pipefail

          echo "===== STOCK CONFIG ====="
          grep -E '^(CONFIG_CC_VERSION_TEXT|CONFIG_CLANG_VERSION|CONFIG_LLD_VERSION|CONFIG_ARCH_MEDIATEK|CONFIG_CUSTOM_PROJECT_OT11|CONFIG_CUSTOM_PROJECT_OT11_WIFI|CONFIG_MTK_DTBO_FEATURE|CONFIG_BUILD_ARM64_DTB_IMAGE_NAMES|CONFIG_BUILD_ARM64_DTB_OVERLAY_IMAGE_NAMES)=' \
            "$STOCK_CONFIG" || true

          echo "===== SOURCE CONFIG ====="
          grep -E '^(CONFIG_CC_VERSION_TEXT|CONFIG_CLANG_VERSION|CONFIG_LLD_VERSION|CONFIG_ARCH_MEDIATEK|CONFIG_CUSTOM_PROJECT_OT11|CONFIG_CUSTOM_PROJECT_OT11_WIFI|CONFIG_MTK_DTBO_FEATURE|CONFIG_BUILD_ARM64_DTB_IMAGE_NAMES|CONFIG_BUILD_ARM64_DTB_OVERLAY_IMAGE_NAMES)=' \
            CONFIG_GTA9_WIFI_FINAL.config || true

          diff -u "$STOCK_CONFIG" CONFIG_GTA9_WIFI_FINAL.config > CONFIG_STOCK_VS_SOURCE.diff || true

          echo "===== CONFIG DIFFERENCES ====="
          if [ -s CONFIG_STOCK_VS_SOURCE.diff ]; then
            grep -E '^[+-]CONFIG_|^[+-]# CONFIG_' CONFIG_STOCK_VS_SOURCE.diff | head -n 250 || true
          else
            echo "No config differences."
          fi

      - name: Test stock config against source
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_samsung_gta9
          export PATH="$CLANG_DIR/bin:$PATH"

          cp "$STOCK_CONFIG" .config
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          cp .config ../CONFIG_STOCK_ACCEPTED_BY_SOURCE.config

          echo "===== STOCK CONFIG AFTER SOURCE olddefconfig ====="
          grep -E '^(CONFIG_ARCH_MEDIATEK|CONFIG_CUSTOM_PROJECT_OT11|CONFIG_CUSTOM_PROJECT_OT11_WIFI|CONFIG_MTK_DTBO_FEATURE)=' .config || true

          diff -u "$STOCK_CONFIG" .config > ../CONFIG_STOCK_NORMALIZATION.diff || true

      - name: Build kernel and both GTA9 DTBs
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_samsung_gta9
          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-

          cp ../CONFIG_GTA9_WIFI_FINAL.config .config

          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- Image.gz

          make -j"$(nproc)" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            arch/arm64/boot/dts/mediatek/mt8781_gta9_eur_open_00.dtb \
            arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dtb

          test -s arch/arm64/boot/Image.gz
          test -s arch/arm64/boot/dts/mediatek/mt8781_gta9_eur_open_00.dtb
          test -s arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dtb
          test -s vmlinux

      - name: Inspect built kernel and DTBs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forensic
          BUILT=kernel_samsung_gta9

          gzip -dc "$BUILT/arch/arm64/boot/Image.gz" > forensic/built.Image

          {
            echo "===== SOURCE ====="
            git -C "$BUILT" rev-parse HEAD
            git -C "$BUILT" describe --always --dirty 2>/dev/null || true
            make -C "$BUILT" -s kernelversion

            echo
            echo "===== BUILT KERNEL ====="
            file "$BUILT/arch/arm64/boot/Image.gz" "$BUILT/vmlinux"
            strings -a forensic/built.Image | grep -E 'Linux version|5\.10\.' | head -n 20 || true

            echo
            echo "===== STOCK KERNEL ====="
            file "$STOCK_KERNEL"
            strings -a "$STOCK_KERNEL" | grep -E 'Linux version|5\.10\.' | head -n 20 || true
          } | tee forensic/KERNEL_IDENTITY.txt

          for item in base wifi; do
            if [ "$item" = base ]; then
              dtb="$BUILT/arch/arm64/boot/dts/mediatek/mt8781_gta9_eur_open_00.dtb"
            else
              dtb="$BUILT/arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dtb"
            fi
            dtc -I dtb -O dts "$dtb" > "forensic/built_$item.dts"
            {
              echo "===== BUILT $item DTB ====="
              grep -E 'compatible =|model =' "forensic/built_$item.dts" | head -n 40 || true
            } | tee "forensic/BUILT_${item^^}_DTB.txt"
          done

          sha256sum \
            "$BUILT/arch/arm64/boot/Image.gz" \
            "$BUILT/arch/arm64/boot/dts/mediatek/mt8781_gta9_eur_open_00.dtb" \
            "$BUILT/arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dtb" \
            "$STOCK_KERNEL" "$STOCK_DTB" | tee forensic/SHA256.txt

      - name: Inspect stock vendor_boot DTB blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forensic

          python3 - "$STOCK_DTB" <<'PY' | tee forensic/STOCK_DTB_LAYOUT.txt
          import sys, struct
          p = sys.argv[1]
          b = open(p, "rb").read()
          magic = b"\xd0\x0d\xfe\xed"
          hits = []
          i = 0
          while True:
              i = b.find(magic, i)
              if i < 0:
                  break
              if i + 8 <= len(b):
                  size = struct.unpack(">I", b[i+4:i+8])[0]
                  if 40 <= size <= len(b) - i:
                      hits.append((i, size))
              i += 4
          print("container_size:", len(b))
          print("valid_fdt_blobs:", len(hits))
          for n, (off, size) in enumerate(hits):
              print(f"{n}: offset={off} size={size}")
          PY

          python3 - "$STOCK_DTB" <<'PY' | tee forensic/STOCK_DTB_MATCHES.txt
          import sys, struct, subprocess, tempfile, os
          p = sys.argv[1]
          b = open(p, "rb").read()
          magic = b"\xd0\x0d\xfe\xed"
          n = 0
          i = 0
          while True:
              i = b.find(magic, i)
              if i < 0:
                  break
              if i + 8 <= len(b):
                  size = struct.unpack(">I", b[i+4:i+8])[0]
                  if 40 <= size <= len(b) - i:
                      fn = f"/tmp/stock_{n}.dtb"
                      open(fn, "wb").write(b[i:i+size])
                      r = subprocess.run(["dtc", "-I", "dtb", "-O", "dts", fn],
                                         capture_output=True, text=True)
                      if r.returncode == 0:
                          hits = []
                          for line in r.stdout.splitlines():
                              low = line.lower()
                              if ("compatible =" in line or "model =" in line) and                        any(x in low for x in ("gta9", "mt8781", "samsung")):
                                  hits.append(line.strip())
                          if hits:
                              print(f"blob={n} offset={i} size={size}")
                              print("\n".join(hits[:40]))
                      n += 1
              i += 4
          PY

      - name: Write final validation report
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git -C kernel_samsung_gta9 rev-parse HEAD)"

          cat > VALIDATION_14_RESULT.txt <<EOF
          GTA9 14.0 STOCK VALIDATION
          ==========================
          Source repo : $GTA9_REPO
          Branch      : $GTA9_BRANCH
          Commit      : $SOURCE_COMMIT
          Kernel      : 5.10.205
          Target      : Samsung Galaxy Tab A9 GTA9 / MT8781

          PASS CHECKS
          -----------
          Source kernelversion                : PASS
          GTA9 defconfig identity             : PASS
          GTA9 WiFi DTS identity              : PASS
          Source-native config generation     : PASS
          Required DTB overlay config         : PASS
          Stock config accepted by source     : PASS
          Source-native Image.gz build        : PASS
          GTA9 base DTB build                 : PASS
          GTA9 WiFi DTB build                 : PASS
          Stock kernel/DTB forensic inspection : PASS

          INTERPRETATION
          --------------
          This validates source identity, configuration compatibility, buildability,
          and DTB/device identity against the supplied stock reference artifact.
          It does NOT claim binary equality between a fresh rebuild and Samsung stock.
          It does NOT modify kernel functionality or add ReSukiSU/KernelSU.

          Evidence:
          - STOCK_REFERENCE.txt
          - SOURCE_14_LOCK.txt
          - CONFIG_STOCK_VS_SOURCE.diff
          - CONFIG_STOCK_ACCEPTED_BY_SOURCE.config
          - CONFIG_STOCK_NORMALIZATION.diff
          - forensic/
          EOF

          cat VALIDATION_14_RESULT.txt

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: GTA9-14.0-KINTIL-STOCK-VALIDATION
          if-no-files-found: error
          path: |
            STOCK_REFERENCE.txt
            SOURCE_14_LOCK.txt
            CONFIG_GTA9_BASE.config
            CONFIG_GTA9_WIFI_FINAL.config
            CONFIG_STOCK_VS_SOURCE.diff
            CONFIG_STOCK_ACCEPTED_BY_SOURCE.config
            CONFIG_STOCK_NORMALIZATION.diff
            VALIDATION_14_RESULT.txt
            forensic/
            kernel_samsung_gta9/arch/arm64/boot/Image.gz
            kernel_samsung_gta9/arch/arm64/boot/dts/mediatek/mt8781_gta9_eur_open_00.dtb
            kernel_samsung_gta9/arch/arm64/boot/dts/mediatek/mt8781_gta9wifi_eur_open_00.dtb
