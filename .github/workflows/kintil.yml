set -euo pipefail

SOURCE_DIR="${1:?Usage: mmu-audit.sh <source-dir> <config> <report> <baseline>}"
CONFIG_FILE="${2:?Usage: mmu-audit.sh <source-dir> <config> <report> <baseline>}"
REPORT_FILE="${3:?Usage: mmu-audit.sh <source-dir> <config> <report> <baseline>}"
BASELINE_FILE="${4:?Usage: mmu-audit.sh <source-dir> <config> <report> <baseline>}"

mkdir -p "$(dirname "$REPORT_FILE")"

test -d "$SOURCE_DIR"
test -f "$CONFIG_FILE"
test -f "$BASELINE_FILE"

required_config=(
  "CONFIG_MMU=y"
  "CONFIG_ARM64=y"
)

for item in "${required_config[@]}"; do
  if ! grep -qx "$item" "$CONFIG_FILE"; then
    echo "ERROR: missing required configuration: $item" >&2
    exit 1
  fi
done

protected_files=(
  "arch/arm64/mm/mmu.c"
  "arch/arm64/mm/proc.S"
  "arch/arm64/mm/context.c"
  "arch/arm64/mm/fault.c"
  "arch/arm64/mm/ioremap.c"
  "arch/arm64/mm/pageattr.c"
  "arch/arm64/mm/pgd.c"
  "arch/arm64/mm/tlb.c"
  "arch/arm64/include/asm/tlb.h"
  "arch/arm64/include/asm/tlbflush.h"
  "arch/arm64/include/asm/mmu_context.h"
  "arch/arm64/include/asm/pgtable.h"
  "arch/arm64/include/asm/pgtable-prot.h"
)

{
  echo "MMU INVARIANT AUDIT"
  echo "==================="
  echo "SOURCE_DIR=$SOURCE_DIR"
  echo "CONFIG_FILE=$CONFIG_FILE"
  echo

  echo "[CONFIGURATION]"
  printf '%s\n' "${required_config[@]}"
  echo "STATUS=PASS"
  echo

  echo "[PROTECTED FILES]"
  for file in "${protected_files[@]}"; do
    path="$SOURCE_DIR/$file"

    if [[ ! -f "$path" ]]; then
      echo "ERROR: protected MMU file missing: $file" >&2
      exit 1
    fi

    echo "PRESENT $file"
  done

  echo
  echo "[BASELINE]"
  cat "$BASELINE_FILE"

  echo
  echo "MMU_INVARIANT_STATUS=PASS"
} | tee "$REPORT_FILE"
